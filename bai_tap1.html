<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel có đẹp trai không</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <main>
        <div class="box-wrapper">
            <h1 id="question-title">Daniel có đẹp trai không?</h1>
            
            <!-- Khung hiển thị hình ảnh -->
            <img id="surprise-img" class="hidden-img" src="" alt="Surprise Image">

            <!-- Khung hiển thị câu nhắc nhở/thông điệp -->
            <p id="message-text" class="message-text"></p>

            <div class="button-container">
                <button id="btn-yes" class="button1 btn-yes">Có</button>
                <button id="btn-no" class="button1 btn-no">Không</button>
            </div>
        </div>
    </main>

    <!-- 🎵 Thẻ nhạc nền (Thay link hoặc tên file nhạc của bạn vào src) -->
    <audio id="bg-music" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
